name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zip for claude.ai
        run: |
          mkdir -p dist
          cp -r skills/learn-topic dist/learn-topic
          (cd dist && zip -r ../learn-topic.zip learn-topic)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" learn-topic.zip --generate-notes
