<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="learn-topic: an AI tutor skill that makes you think, then helps you remember">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a5b4fc" fill-opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <!-- label chips -->
    <rect x="80" y="84" width="176" height="38" rx="19" fill="#312e81" stroke="#6366f1"/>
    <text x="168" y="109" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#c7d2fe">AGENT SKILL</text>
    <rect x="270" y="84" width="84" height="38" rx="19" fill="none" stroke="#475569"/>
    <text x="312" y="109" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#94a3b8">MIT</text>

    <!-- title -->
    <text x="80" y="238" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">learn-topic</text>

    <!-- tagline -->
    <text x="80" y="310" font-size="38" font-weight="500" fill="#c7d2fe">An AI tutor that makes you think,</text>
    <text x="80" y="358" font-size="38" font-weight="500" fill="#c7d2fe">then helps you <tspan fill="#fbbf24" font-weight="700">remember.</tspan></text>

    <!-- pipeline -->
    <g font-size="23" font-weight="600" text-anchor="middle">
      <rect x="80" y="440" width="170" height="64" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2"/>
      <text x="165" y="480" fill="#e0e7ff">Diagnose</text>
      <text x="268" y="480" fill="#6366f1" font-size="30">›</text>

      <rect x="286" y="440" width="120" height="64" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2"/>
      <text x="346" y="480" fill="#e0e7ff">Map</text>
      <text x="424" y="480" fill="#6366f1" font-size="30">›</text>

      <rect x="442" y="440" width="130" height="64" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2"/>
      <text x="507" y="480" fill="#e0e7ff">Teach</text>
      <text x="590" y="480" fill="#6366f1" font-size="30">›</text>

      <rect x="608" y="440" width="140" height="64" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2"/>
      <text x="678" y="480" fill="#e0e7ff">Recall</text>
      <text x="766" y="480" fill="#6366f1" font-size="30">›</text>

      <rect x="784" y="440" width="130" height="64" rx="16" fill="#fbbf24"/>
      <text x="849" y="480" fill="#1e1b4b" font-weight="800">Cards</text>
    </g>

    <text x="80" y="580" font-size="22" font-weight="500" fill="#818cf8">github.com/Kid72/learn-topic</text>

    <!-- flashcard stack -->
    <g transform="translate(900 120) rotate(8)">
      <rect width="300" height="190" rx="22" fill="#4338ca" fill-opacity="0.85" filter="url(#shadow)"/>
    </g>
    <g transform="translate(860 170) rotate(-6)" filter="url(#shadow)">
      <rect width="330" height="236" rx="22" fill="#f8fafc"/>
      <text x="26" y="40" font-size="13" font-weight="800" letter-spacing="3" fill="#6366f1">FRONT</text>
      <text x="26" y="76" font-size="22" font-weight="700" fill="#0f172a">Why do indexes slow</text>
      <text x="26" y="104" font-size="22" font-weight="700" fill="#0f172a">down INSERTs?</text>
      <line x1="26" y1="126" x2="304" y2="126" stroke="#e2e8f0" stroke-width="2"/>
      <text x="26" y="156" font-size="13" font-weight="800" letter-spacing="3" fill="#d97706">BACK</text>
      <text x="26" y="184" font-size="19" fill="#334155">Each insert also updates</text>
      <text x="26" y="210" font-size="19" fill="#334155">every index on the table.</text>
    </g>
  </g>
</svg>
